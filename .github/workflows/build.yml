name: build
on: [push, pull_request]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        cxx: [g++, clang++]
    steps:
      - uses: actions/checkout@v4
      - name: Build every program
        run: make CXX=${{ matrix.cxx }} CXXFLAGS="-std=c++17 -O2 -Wall -Werror=return-type"
